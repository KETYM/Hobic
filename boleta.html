<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleta de Compra - Hobic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <div class="container my-5" style="max-width: 600px;">
        <div class="card p-4 shadow-lg" style="background-color: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);">
            
            <!-- Encabezado con el Logotipo de Hobic -->
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-block mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="140" height="40">
                        <path d="M12,10 Q15,10 15,5 Q15,10 18,10 Q15,10 15,15 Q15,10 12,10 Z" fill="#ff7eb3"/>
                        <path d="M25,12 C18,12 12,18 12,28 C12,38 18,42 25,42 L25,25 Z" fill="#ffffff"/>
                        <path d="M28,25 L28,42 C35,42 41,38 41,28 C41,18 35,12 28,12 Z" fill="#e0006c"/>
                        <path d="M18,26 h-2 v2 h2 v2 h2 v-2 h2 v-2 h-2 v-2 h-2 v2 z" fill="#043b7a"/>
                        <circle cx="34" cy="24" r="1.5" fill="#043b7a"/>
                        <circle cx="37" cy="28" r="1.5" fill="#043b7a"/>
                        <text x="50" y="36" font-family="'Nunito', Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-1">HOBI<tspan fill="#e0006c">C</tspan></text>
                    </svg>
                </a>
                <h3 class="text-success fw-bold">¡Compra Exitosa!</h3>
                <p class="text-muted small">Comprobante de transacción electrónica</p>
                <hr class="border-secondary">
            </div>

            <div class="mb-3">
                <p class="mb-1"><strong>Fecha:</strong> <span id="boleta-fecha">-</span></p>
                <p class="mb-1"><strong>Estado:</strong> <span class="badge bg-success">Pagado / Aprobado</span></p>
            </div>

            <h5 class="fw-bold mt-3 mb-2">Detalle de los productos:</h5>
            <ul id="boleta-lista" class="list-group list-group-flush mb-4 rounded bg-transparent">
                <!-- JavaScript inyectará los productos con su foto aquí -->
            </ul>

            <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3 mb-4">
                <h4 class="fw-bold mb-0">Total Pagado:</h4>
                <h4 class="text-success fw-bold mb-0" id="boleta-total">$0</h4>
            </div>

            <div class="text-center">
                <a href="index.html" class="btn btn-primary px-4 fw-bold">Volver al Inicio</a>
            </div>

        </div>
    </div>

    <!-- Script para leer y pintar la boleta con imágenes -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const boletaData = JSON.parse(localStorage.getItem("ultimaBoleta"));
            
            if (!boletaData) {
                alert("No hay registros de compras recientes.");
                window.location.href = "index.html";
                return;
            }

            document.getElementById("boleta-fecha").textContent = boletaData.fecha;
            document.getElementById("boleta-total").textContent = `$${boletaData.total.toLocaleString("es-CL")}`;

            const listaEl = document.getElementById("boleta-lista");
            listaEl.innerHTML = "";

            boletaData.productos.forEach(prod => {
                const subtotal = prod.precio * (prod.cantidad || 1);
                listaEl.innerHTML += `
                    <li class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center border-secondary py-3">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${prod.imagen || 'imagenes/default.jpg'}" alt="${prod.nombre}" style="width: 45px; height: 55px; object-fit: contain; border-radius: 4px; background: rgba(255,255,255,0.05); padding: 2px;">
                            <div>
                                <span class="fw-bold d-block">${prod.nombre || prod.titulo}</span>
                                <small class="text-muted">Cantidad: ${prod.cantidad || 1}</small>
                            </div>
                        </div>
                        <span class="fw-semibold">$${subtotal.toLocaleString("es-CL")}</span>
                    </li>
                `;
            });
        });
    </script>
</body>
</html>
