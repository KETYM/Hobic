<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Hobic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="main-header" style="position: relative;"></header>

    <main>
        <div class="contenedor auth-card">
            <h2>Crear Cuenta</h2>
            <form id="form-registro" class="form-producto">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Tu nombre y apellido" required>

                <label for="run">RUN:</label>
                <input type="text" id="run" placeholder="Ej: 12345678-9" maxlength="12" required>
                <small class="text-danger d-none fw-bold" id="error-run"
                    style="display: block; margin-top: -10px; margin-bottom: 10px;">Formato inválido. Usa el formato
                    12345678-9.</small>

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" placeholder="Ej: Av. Siempreviva 742" required>

                <label for="region">Región:</label>
                <select id="region" class="form-select shadow-none mb-3" required>
                    <option value="">Seleccione una región</option>
                </select>

                <label for="comuna">Comuna:</label>
                <select id="comuna" class="form-select shadow-none mb-3" required>
                    <option value="">Seleccione primero una región</option>
                </select>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                <!-- Mensaje de error dinámico para el correo -->
                <small class="text-danger d-none fw-bold" id="error-email"
                    style="display: block; margin-top: -10px; margin-bottom: 10px;">Formato de correo inválido.</small>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>

                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>
                <!-- Mensaje de error dinámico para la contraseña -->
                <small class="text-danger d-none fw-bold" id="error-password"
                    style="display: block; margin-top: -10px; margin-bottom: 10px;">Las contraseñas no
                    coinciden.</small>

                <button type="submit" class="btn-primary mt-2">Registrarse</button>

                <div class="auth-registro mt-3">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="inicioSesion.html">Inicia sesión</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hobic - Todos los derechos reservados</p>
    </footer>
    <script src="header.js"></script>
    <script src="regionesComunas.js"></script> 
    <script src="auth.js"></script>
    <script src="carrito.js"></script>
    <script src="main.js"></script>
</body>

</html>
