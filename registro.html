<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Hobic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="main-header" style="position: relative;"></header>

    <main>
        <div class="contenedor auth-card">
            <h2>Crear Cuenta</h2>
            <form id="form-registro" class="form-producto">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Tu nombre y apellido" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>

                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>

                <button type="submit" class="btn-primary">Registrarse</button>

                <div class="auth-registro">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="inicioSesion.html">Inicia sesión</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hobic - Todos los derechos reservados</p>
    </footer>
<script src="header.js"></script>
    <script src="auth.js"></script>
    <script src="carrito.js"></script>
    <script src="main.js"></script>
</body>

</html>
