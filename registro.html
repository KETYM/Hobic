    <header>
        <nav>
            <div class="nav-links">
                <a href="index.html">Inicio</a> |
                <a href="libros.html">Libros</a> |
                <a href="series.html">Series</a> |
                <a href="videojuegos.html">Videojuegos</a> |
                <a href="mangas.html">Mangas</a> |
                <a href="catalogo.html">Catálogo</a> |
                <a href="blogs.html">Blogs</a>
            </div>

            <!-- Contenedor derecho: Login + Carrito -->
            <div class="nav-derecha">
                <a href="inicioSesion.html" class="nav-user-btn" id="user-nav-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Inicio de sesión</span>
                </a>

                <a href="carrito.html" class="nav-cart-btn" title="Ir al carrito">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>

                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="contenedor auth-card">
            <h2>Crear Cuenta</h2>
            <form class="form-producto">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Tu nombre y apellido" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Crea una contraseña" required>

                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>

                <button type="submit" class="btn-primary">Registrarse</button>

                <div class="auth-registro">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="inicioSesion.html">Inicia sesión</a>
                </div>
            </form>
        </div>
    </main>

    <footer>

    </footer>

</body>

</html>
