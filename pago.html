<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - Hobic</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER -->
    <header id="main-header" style="position: relative;"></header>

    <main class="container my-5">
        <h2 class="fw-bold mb-4">Finalizar Compra</h2>

        <form id="form-pago" class="row">
            <!-- COLUMNA IZQUIERDA: Formulario -->
            <div class="col-lg-8">

                <!-- Datos de Envío -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">1. Datos de envío</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control shadow-none" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" class="form-control shadow-none" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Dirección exacta</label>
                                <input type="text" class="form-control shadow-none"
                                    placeholder="Calle, número, depto..." required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Comuna / Ciudad</label>
                                <input type="text" class="form-control shadow-none" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Medios de Pago -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">2. Medio de pago</h5>

                        <!-- Opciones de pago (Radios) -->
                        <div class="form-check mb-3 p-3 border rounded">
                            <input class="form-check-input ms-1" type="radio" name="medioPago" id="pagoTarjeta"
                                value="tarjeta" checked required>
                            <label class="form-check-label ms-2 fw-bold w-100" for="pagoTarjeta">
                                Tarjeta de Crédito / Débito
                                <div class="text-muted small fw-normal mt-1">Serás redirigido a Webpay Plus al
                                    confirmar.</div>
                            </label>
                        </div>

                        <div class="form-check mb-3 p-3 border rounded">
                            <input class="form-check-input ms-1" type="radio" name="medioPago" id="pagoTransferencia"
                                value="transferencia">
                            <label class="form-check-label ms-2 fw-bold w-100" for="pagoTransferencia">
                                Transferencia Bancaria
                                <div class="text-muted small fw-normal mt-1">Te mostraremos los datos de la cuenta al
                                    finalizar.</div>
                            </label>
                        </div>

                        <div class="form-check p-3 border rounded">
                            <input class="form-check-input ms-1" type="radio" name="medioPago" id="pagoMercadoPago"
                                value="mercadopago">
                            <label class="form-check-label ms-2 fw-bold w-100" for="pagoMercadoPago">
                                MercadoPago
                                <div class="text-muted small fw-normal mt-1">Paga con saldo o tarjetas guardadas en tu
                                    cuenta.</div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Resumen y Botón -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 position-sticky" style="top: 20px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Resumen</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Total a pagar</span>
                            <span id="total-pago" class="fw-bold fs-4 text-primary">$0</span>
                        </div>
                        <hr>
                        <p class="small text-muted mb-4">Tus datos personales se utilizarán para procesar tu pedido y
                            respaldar tu experiencia en este sitio web.</p>

                        <!-- Botón de Confirmar (submit del form) -->
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-none"
                            style="font-size: 1.1rem;">
                            Confirmar y Pagar
                        </button>

                        <div class="text-center mt-3">
                            <a href="carrito.html" class="text-decoration-none text-muted small">Volver al carrito</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="header.js"></script>
    <script src="auth.js"></script>
    <script src="carrito.js"></script>
    <script src="main.js"></script>
</body>

</html>
