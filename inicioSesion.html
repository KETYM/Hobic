<!DOCTYPE html>
<html lang="es">

<link rel="stylesheet" href="style.css">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header id="main-header" style="position: relative;"></header>
    <main>
        <div class="contenedor auth-card">
            <h2>Iniciar Sesión</h2>
            <form id="form-login" class="form-producto">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Tu contraseña" required>

                <p id="mensaje-error" style="color: #dc2626; font-size: 14px; display: none; margin-bottom: 10px;"></p>

                <button type="submit" class="btn-primary">Ingresar</button>

                <div class="auth-registro">
                    <span>¿No tienes cuenta?</span>
                    <a href="registro.html">Crear cuenta</a>
                </div>

                <div class="divisor-linea">
                    <span>o</span>
                </div>

                <button type="button" id="btn-login-admin" class="btn-admin">Ingresar como Administrador</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hobic - Todos los derechos reservados</p>
    </footer>
    <script src="header.js"></script>
    <script src="auth.js"></script>
    <script src="carrito.js"></script>
    <script src="main.js"></script>

</body>

</html>
