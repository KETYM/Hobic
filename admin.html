<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hobic</title>
    <!-- AQUÍ ESTÁ EL CSS QUE FALTABA -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <div class="nav-links">
                <a href="index.html">Inicio</a> |
                <a href="libros.html">Libros</a> |
                <a href="series.html">Series</a> |
                <a href="videojuegos.html">Videojuegos</a> |
                <a href="mangas.html">Mangas</a> |
                <a href="catalogo.html">Catálogo</a> |
                <a href="blogs.html">Blogs</a>
            </div>

            <!-- Contenedor derecho: Login + Carrito -->
            <div class="nav-derecha">
                <a href="inicioSesion.html" class="nav-user-btn" id="user-nav-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Inicio de sesión</span>
                </a>

                <a href="carrito.html" class="nav-cart-btn" title="Ir al carrito">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <main class="contenedor" style="margin-top: 40px; text-align: center;">
        <h1>Panel de Administración</h1>
        <p>Bienvenido al panel de control exclusivo para administradores.</p>
    </main>

    <!-- AQUÍ ESTÁ EL SCRIPT QUE FALTABA -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const usuarioGuardado = sessionStorage.getItem('usuarioActual');
            const userNavContainer = document.getElementById('user-nav-container');

            if (usuarioGuardado && userNavContainer) {
                const usuario = JSON.parse(usuarioGuardado);
                userNavContainer.removeAttribute('href'); // Deshabilita el enlace al login

                if (usuario.rol === 'admin') {
                    // Vista para Administrador
                    userNavContainer.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5z"></path>
                        </svg>
                        <span>Hola, Admin</span>
                        <button id="btn-logout" title="Cerrar sesión" style="background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 13px; margin-left: 10px; text-decoration: underline; padding: 0;">(Salir)</button>
                    `;
                } else {
                    // Si un usuario normal intenta entrar aquí, lo devolvemos al inicio por seguridad
                    alert("No tienes permisos para ver esta página.");
                    window.location.href = "index.html";
                }

                // Evento para cerrar sesión
                const btnLogout = document.getElementById('btn-logout');
                if (btnLogout) {
                    btnLogout.addEventListener('click', function (e) {
                        e.stopPropagation();
                        sessionStorage.removeItem('usuarioActual');
                        window.location.href = "index.html";
                    });
                }
            } else {
                // Si nadie ha iniciado sesión y entra a admin.html, lo manda a loguearse
                alert("Debes iniciar sesión como administrador.");
                window.location.href = "inicioSesion.html";
            }
        });
    </script>
</body>

</html>
