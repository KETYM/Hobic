<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Hobic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f8f9fa;">
    
    <header id="main-header" style="position: relative;"></header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Gestión de Inventario</h2>
            <span class="badge bg-danger fs-6">Modo Administrador</span>
        </div>

        <div class="row g-4">
            <!-- Formulario CRUD -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3" id="form-titulo">Agregar Producto</h5>
                        <form id="form-crud">
                            <input type="hidden" id="crud-id">
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Nombre del producto</label>
                                <input type="text" id="crud-nombre" class="form-control shadow-none" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Categoría</label>
                                <select id="crud-categoria" class="form-select shadow-none" required>
                                    <option value="Libros">Libros</option>
                                    <option value="Mangas">Mangas</option>
                                    <option value="Series">Series</option>
                                    <option value="Videojuegos">Videojuegos</option>
                                </select>
                            </div>
                            <!--CAMPO PARA LA IMAGEN -->
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Subir Imagen</label>
                                <input type="file" id="crud-imagen" class="form-control shadow-none" accept="image/*" required>
                            <small class="text-muted" id="texto-imagen-actual"></small>
                            </div>
                            <!-- Selector de Promo -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="crud-promo">
                                <label class="form-check-label fw-bold text-dark" for="crud-promo">
                                    Destacar en "Promos" del Inicio
                                </label>
                            </div>

                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">Precio ($)</label>
                                    <input type="number" id="crud-precio" class="form-control shadow-none" required min="1">
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">Stock</label>
                                    <input type="number" id="crud-stock" class="form-control shadow-none" required min="0">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold" id="btn-guardar-crud">Guardar Producto</button>
                            <button type="button" class="btn btn-light w-100 mt-2 d-none" id="btn-cancelar-crud">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Inventario -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th class="ps-4">Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-inventario">
                                <!-- Los productos se inyectarán aquí con JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="header.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script> 
    <script src="admin.js"></script>
</body>
</html>
