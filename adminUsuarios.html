<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Hobic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-header" style="position: relative;"></header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Gestión de Usuarios</h2>
            <div>
                <a href="admin.html" class="btn btn-outline-secondary me-2 fw-bold" style="border-radius: 8px;">Ir a
                    Inventario</a>
                <span class="badge bg-danger fs-6">Modo Administrador</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Formulario CRUD de Usuarios -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3" id="form-titulo-user">Agregar Usuario</h5>
                        <form id="form-crud-usuario">
                            <!-- Campo oculto para saber qué usuario estamos editando usando su correo -->
                            <input type="hidden" id="crud-user-correo-original">

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Nombre Completo</label>
                                <input type="text" id="crud-user-nombre" class="form-control shadow-none"
                                    placeholder="Ej: Alejandra" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">RUN</label>
                                    <input type="text" id="crud-user-run" class="form-control shadow-none"
                                        placeholder="Ej: 12.345.678-9" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">Rol</label>
                                    <select id="crud-user-rol" class="form-select shadow-none" required>
                                        <option value="cliente">Cliente</option>
                                        <option value="vendedor">Vendedor</option>
                                        <option value="admin">Administrador</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Dirección</label>
                                <input type="text" id="crud-user-direccion" class="form-control shadow-none"
                                    placeholder="Ej: Av. Siempre Viva 742" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">Región</label>
                                    <select id="crud-user-region" class="form-select shadow-none" required>
                                        <option value="">Seleccione...</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold">Comuna</label>
                                    <select id="crud-user-comuna" class="form-select shadow-none" required>
                                        <option value="">Seleccione primero una región</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                                <input type="email" id="crud-user-correo" class="form-control shadow-none"
                                    placeholder="ejemplo@correo.com" required>
                                <small class="text-danger d-none fw-bold mt-1" id="error-user-correo">El correo ya
                                    existe.</small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Contraseña</label>
                                <input type="text" id="crud-user-pass" class="form-control shadow-none"
                                    placeholder="Mínimo 6 caracteres" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold" id="btn-guardar-user">Guardar
                                Usuario</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none"
                                id="btn-cancelar-user">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Usuarios -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th class="ps-4">Usuario</th>
                                    <th>RUN</th>
                                    <th>Rol</th>
                                    <th>Dirección</th>
                                    <th class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios">
                                <!-- Los usuarios se inyectan con JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="header.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script>
    <script src="regionesComunas.js"></script>
    <script src="adminUsuarios.js"></script>
</body>

</html>
